[project]
name = "matrikontho"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "av==18.1.0",
    "faster-whisper==1.2.1",
    "google-genai>=1.0",
    "pandas>=2.2",
    "streamlit>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
